#  Qudi configuration file for wavemeter scanning with real hardware.
#  Replace 'your_ni_instreamer' below with the actual NI DAQ / photon counter hardware entry.

global:
    startup: []
    remote_modules_server:
        address: '134.60.83.135'
        port: 12345
    namespace_server_port: 18861
    default_data_dir: 'C:\\Data'
    force_remote_calls_by_value: True
    stylesheet: 'qdark.qss'

gui:
    time_series_gui:
        module.Class: 'time_series.time_series_gui.TimeSeriesGui'
        options:
            use_antialias: True
        connect:
            _time_series_logic_con: time_series_reader_logic

    wavemeter_scanning_gui:
        module.Class: 'wavemeter.wavemeter_scanning_gui.WavemeterHistogramGui'
        connect:
            _wavemeter_histogram_logic_con: wavemeter_scanning_logic

logic:
    time_series_reader_logic:
        module.Class: 'time_series_reader_logic.TimeSeriesReaderLogic'
        options:
            max_frame_rate: 20
            channel_buffer_size: 1048576
            calc_digital_freq: True
        connect:
            # Replace 'your_ni_instreamer' with your actual photon counter / NI DAQ hardware module name
            streamer: your_ni_instreamer

    wavemeter_scanning_logic:
        module.Class: 'wavemeter_scanning_logic_3.WavemeterLogic'
        connect:
            streamer: wave_instreamer
            counterlogic: time_series_reader_logic

hardware:
    wave_instreamer:
        module.Class: 'wavemeter.high_finesse_wavemeter.HighFinesseWavemeter'
        connect:
            proxy: wavemeter_proxy
        options:
            channels:
                dye_laser:
                    switch_ch: 1
                    unit: 'm'
        allow_remote: True

    wavemeter_proxy:
        module.Class: 'wavemeter.high_finesse_proxy.HighFinesseProxy'
        options:
            watchdog_interval: 1.0
